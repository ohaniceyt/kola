<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="0.55" stop-color="#059669"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <circle cx="392" cy="96" r="140" fill="#ffffff" opacity="0.08"/>
  <!-- cauri Kola : coquillage lisse vu de l'ouverture, longue fente dentée -->
  <g transform="rotate(-8 256 256)">
    <!-- coquille ovale (porcelaine lisse) -->
    <ellipse cx="256" cy="256" rx="104" ry="138" fill="#ffffff" opacity="0.97"/>
    <!-- reflet du dôme (dessous plus pâle : la porcelaine du cauri) -->
    <ellipse cx="256" cy="200" rx="72" ry="86" fill="#059669" opacity="0.10"/>
    <!-- ouverture : longue fente horizontale à dents -->
    <path d="M158 256 C 202 226, 310 226, 354 256 C 310 286, 202 286, 158 256 Z" fill="#047857" opacity="0.95"/>
    <!-- dents (barreaux blancs) -->
    <path d="M176 244 v25 M200 239 v35 M224 236 v41 M248 234 v45 M272 236 v41 M296 239 v35 M320 244 v25"
          stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.92"/>
  </g>
</svg>